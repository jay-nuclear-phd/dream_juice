<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드림주스 주식스터디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#fff9ee; --ink:#2b2320; --soft:#6b5f58; --red:#e05a50; --line:#eadfcd; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; word-break:keep-all; }
  header { background:linear-gradient(110deg,#eeb05a,#f2c873 45%,#f6dd8c); padding:56px 16px 48px; }
  .wrap { max-width:880px; margin:0 auto; padding:0 16px; }
  header { overflow:hidden; }
  header .wrap { display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .logo { flex:none; height:170px; width:auto; margin:-24px 8px -36px 0; transform:rotate(4deg); filter:drop-shadow(0 6px 14px rgba(150,60,30,.18)); }
  @media (max-width:560px) { .logo { height:96px; margin:-8px 0 -20px; } }
  .pill { display:inline-block; background:var(--red); color:#fff; font-weight:700; border-radius:999px; padding:4px 14px; font-size:15px; }
  h1 { font-size:clamp(28px,5vw,42px); margin:14px 0 0; letter-spacing:-0.02em; }
  main.wrap { padding-top:44px; padding-bottom:64px; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  a.item { display:flex; gap:18px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 22px; color:inherit; text-decoration:none; transition:transform .15s, box-shadow .15s; }
  a.item:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(60,40,20,.1); }
  .no { flex:none; width:48px; height:48px; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-weight:800; }
  .t { display:block; font-size:19px; font-weight:700; }
  .s { display:block; font-size:14px; color:var(--soft); margin-top:4px; }
</style>
</head>
<body>
<header><div class="wrap"><div><span class="pill">드림주스</span><h1>꿈꾸는 군인의 건강한 주식스터디</h1></div><img class="logo" src="assets/juice.png" alt="" width="380" height="480"></div></header>
<main class="wrap">
  <ol>
    <li><a class="item" href="lecture1/index.html"><span class="no">1</span><span><span class="t">미국주식 안전하게 투자하는 방법</span><span class="s">주식 투자가 위험하다는 착각 · 왜 미국 주식인가 · 미국 ETF 제대로 이해하기</span></span></a></li>
    <li><a class="item" href="lecture2/index.html"><span class="no">2</span><span><span class="t">미국주식 실전투자 전략 세우기</span><span class="s">6하 원칙으로 세우는 나만의 투자 전략 · 투자 방식 3종 세트 · 계좌와 증여</span></span></a></li>
    <li><a class="item" href="lecture4/index.html"><span class="no">4</span><span><span class="t">투자 전략 발표와 투자 원칙 만들기</span><span class="s">믿음 &amp; 간단 · 부의 복리공식 재해석 · 투자 10계명 · 거래 시간과 수수료</span></span></a></li>
    <li><a class="item" href="lecture5/index.html"><span class="no">5</span><span><span class="t">경제뉴스와 지표 보는 눈 기르기</span><span class="s">경제 뉴스에 대한 착각 · 관심 가져야 할 지표 · 인과관계 · 시간의 차이</span></span></a></li>
  </ol>
</main>
</body>
</html>
